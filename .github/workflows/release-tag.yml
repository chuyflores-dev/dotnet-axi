name: Create release tag

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character commit SHA from main to tag
        required: true
        type: string
      version:
        description: Exact SemVer used to derive v<version>
        required: true
        type: string
      dry_run:
        description: Validate and verify without creating a tag
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-tag-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.target.outputs.release-tag }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Validate release-tag target
        id: target
        shell: pwsh
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          $tag = ./eng/assert-release-tag.ps1 `
            -CandidateCommit $env:CANDIDATE_COMMIT `
            -CandidateVersion $env:CANDIDATE_VERSION
          "release-tag=$tag" >> $env:GITHUB_OUTPUT

  verify-candidate:
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
    with:
      commit: ${{ inputs.commit }}
      version: ${{ inputs.version }}

  report-dry-run:
    if: ${{ inputs.dry_run }}
    needs:
      - validate-tag
      - verify-candidate
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Confirm verified candidate identity
        shell: pwsh
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ needs['validate-tag'].outputs['release-tag'] }}
          VERIFIED_ARTIFACT_DIGEST: ${{ needs['verify-candidate'].outputs['artifact-digest'] }}
          VERIFIED_COMMIT: ${{ needs['verify-candidate'].outputs['candidate-commit'] }}
          VERIFIED_VERSION: ${{ needs['verify-candidate'].outputs['candidate-version'] }}
        run: |
          if ($env:VERIFIED_COMMIT -cne $env:CANDIDATE_COMMIT) {
            throw "Verified candidate commit does not match the requested commit."
          }
          if ($env:VERIFIED_VERSION -cne $env:CANDIDATE_VERSION) {
            throw "Verified candidate version does not match the requested version."
          }
          if ([string]::IsNullOrWhiteSpace($env:VERIFIED_ARTIFACT_DIGEST)) {
            throw "Verified candidate artifact digest is missing."
          }
          Write-Host (
            "Dry run verified $env:RELEASE_TAG at " +
            "$env:CANDIDATE_COMMIT; no tag was created.")

  create-tag:
    if: ${{ ! inputs.dry_run }}
    needs:
      - validate-tag
      - verify-candidate
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write

    steps:
      - name: Confirm verified candidate identity
        shell: pwsh
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          VERIFIED_ARTIFACT_DIGEST: ${{ needs['verify-candidate'].outputs['artifact-digest'] }}
          VERIFIED_COMMIT: ${{ needs['verify-candidate'].outputs['candidate-commit'] }}
          VERIFIED_VERSION: ${{ needs['verify-candidate'].outputs['candidate-version'] }}
        run: |
          if ($env:VERIFIED_COMMIT -cne $env:CANDIDATE_COMMIT) {
            throw "Verified candidate commit does not match the requested commit."
          }
          if ($env:VERIFIED_VERSION -cne $env:CANDIDATE_VERSION) {
            throw "Verified candidate version does not match the requested version."
          }
          if ([string]::IsNullOrWhiteSpace($env:VERIFIED_ARTIFACT_DIGEST)) {
            throw "Verified candidate artifact digest is missing."
          }

      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Revalidate release-tag target
        id: target
        shell: pwsh
        env:
          CANDIDATE_COMMIT: ${{ needs['verify-candidate'].outputs['candidate-commit'] }}
          CANDIDATE_VERSION: ${{ needs['verify-candidate'].outputs['candidate-version'] }}
        run: |
          $tag = ./eng/assert-release-tag.ps1 `
            -CandidateCommit $env:CANDIDATE_COMMIT `
            -CandidateVersion $env:CANDIDATE_VERSION
          "release-tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create release tag exactly once
        shell: pwsh
        env:
          CANDIDATE_COMMIT: ${{ needs['verify-candidate'].outputs['candidate-commit'] }}
          RELEASE_TAG: ${{ steps.target.outputs.release-tag }}
        run: |
          $destination = "refs/tags/$env:RELEASE_TAG"
          $refspec = '{0}:{1}' -f $env:CANDIDATE_COMMIT, $destination
          $pushOutput = @(
            & git push `
              --porcelain `
              --no-force `
              --no-follow-tags `
              --no-verify `
              origin `
              $refspec 2>&1)
          $pushExitCode = $LASTEXITCODE
          $pushLines = @(
            $pushOutput |
              ForEach-Object { [string] $_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })

          if ($pushExitCode -ne 0) {
            throw (
              "Create-only tag push failed with exit code ${pushExitCode}:`n" +
              ($pushLines -join "`n"))
          }

          $created = @($pushLines | Where-Object {
            $_.StartsWith("*`t", [System.StringComparison]::Ordinal)
          })
          if ($created.Count -ne 1) {
            throw (
              "Tag push did not create exactly one new ref and was refused:`n" +
              ($pushLines -join "`n"))
          }

          $remoteOutput = @(
            & git ls-remote --refs --tags origin $destination 2>&1)
          if ($LASTEXITCODE -ne 0 -or $remoteOutput.Count -ne 1) {
            throw "Unable to verify the newly created release tag."
          }
          $remoteFields = ([string] $remoteOutput[0]) -split '\s+', 2
          if ($remoteFields.Count -ne 2 -or
              $remoteFields[0] -cne $env:CANDIDATE_COMMIT -or
              $remoteFields[1] -cne $destination) {
            throw "The new release tag does not resolve to the verified commit."
          }

          Write-Host "Created $env:RELEASE_TAG at $env:CANDIDATE_COMMIT."
