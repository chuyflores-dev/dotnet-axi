name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore dotnet-axi.slnx

      - name: Build
        run: dotnet build dotnet-axi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet-axi.slnx --configuration Release --no-build

      - name: Pack local .NET tool
        run: >-
          dotnet pack src/DotNetAxi.Cli/DotNetAxi.Cli.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Verify local .NET tool package
        shell: pwsh
        run: >-
          ./eng/verify-tool-package.ps1
          -PackageDirectory artifacts/packages

      - name: Install Node.js for TOON conformance
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Strict-decode TOON v4.1 fixtures
        run: |
          npx --yes @toon-format/cli@4.1.0 --decode --strict tests/DotNetAxi.Cli.Tests/Fixtures/success.toon > /dev/null
          npx --yes @toon-format/cli@4.1.0 --decode --strict tests/DotNetAxi.Cli.Tests/Fixtures/evidence.toon > /dev/null
