name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore build tools
        run: dotnet tool restore

      - name: Resolve tag-derived version
        shell: pwsh
        run: |
          $version = ./eng/resolve-build-version.ps1
          "DotNetAxiBuildVersion=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore dotnet-axi.slnx

      - name: Verify release versioning and publication controls
        shell: pwsh
        run: ./eng/verify-versioning.ps1

      - name: Build
        run: dotnet build dotnet-axi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet-axi.slnx --configuration Release --no-build

      - name: Pack local .NET tool
        run: >-
          dotnet pack src/DotNetAxi.Cli/DotNetAxi.Cli.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Verify local .NET tool package
        shell: pwsh
        run: >-
          ./eng/verify-tool-package.ps1
          -PackageDirectory artifacts/packages
          -ExpectedVersion $env:DotNetAxiBuildVersion

      - name: Install Node.js for TOON conformance
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Strict-decode production TOON v4.1 documents
        run: |
          set -euo pipefail
          test -f artifacts/toon-conformance/fuzz-untrusted-strings.toon
          find \
            tests/DotNetAxi.Cli.Tests/Fixtures \
            artifacts/toon-conformance \
            -type f \
            -name '*.toon' \
            -print0 |
            sort -z |
            while IFS= read -r -d '' document; do
              timeout 2m npx --yes @toon-format/cli@4.1.0 \
                --decode \
                --strict \
                "$document" > /dev/null
            done
